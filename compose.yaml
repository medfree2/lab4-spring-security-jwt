services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lab4_db
      MYSQL_USER: lab4
      MYSQL_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - lab4_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u lab4 -p\"$$MYSQL_PASSWORD\" lab4_db -e 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 30
volumes:
  lab4_mysql:
